<svg xmlns="http://www.w3.org/2000/svg" width="720" height="48" viewBox="0 0 720 48" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Motion. Orbit Visualization Explorer</title>
  <desc id="desc">A one-time typing animation that reveals the profile headline and then remains static.</desc>
  <style>
    text {
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
      font-size: 20px;
      font-weight: 700;
      dominant-baseline: middle;
    }

    .base {
      opacity: 0;
      animation: hold-text 1ms linear 2200ms forwards;
    }

    .typed {
      clip-path: url(#typing-clip);
      animation: hide-typed 1ms linear 2200ms forwards;
    }

    .caret {
      fill: #568C87;
      animation:
        move-caret 2200ms steps(44, end) forwards,
        blink-caret 700ms step-end 0ms 4,
        hide-caret 1ms linear 2500ms forwards;
    }

    @keyframes hold-text {
      to {
        opacity: 1;
      }
    }

    @keyframes move-caret {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(528px);
      }
    }

    @keyframes blink-caret {
      50% {
        opacity: 0;
      }
    }

    @keyframes hide-caret {
      to {
        opacity: 0;
      }
    }

    @keyframes hide-typed {
      to {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .base {
        opacity: 1;
        animation: none;
      }

      .typed,
      .caret {
        display: none;
      }
    }
  </style>

  <defs>
    <clipPath id="typing-clip">
      <rect x="96" y="4" width="0" height="40">
        <animate attributeName="width" from="0" to="528" dur="2200ms" fill="freeze" calcMode="discrete" values="0;12;24;36;48;60;72;84;96;108;120;132;144;156;168;180;192;204;216;228;240;252;264;276;288;300;312;324;336;348;360;372;384;396;408;420;432;444;456;468;480;492;504;516;528" keyTimes="0;0.0227;0.0455;0.0682;0.0909;0.1136;0.1364;0.1591;0.1818;0.2045;0.2273;0.25;0.2727;0.2955;0.3182;0.3409;0.3636;0.3864;0.4091;0.4318;0.4545;0.4773;0.5;0.5227;0.5455;0.5682;0.5909;0.6136;0.6364;0.6591;0.6818;0.7045;0.7273;0.75;0.7727;0.7955;0.8182;0.8409;0.8636;0.8864;0.9091;0.9318;0.9545;0.9773;1" />
      </rect>
    </clipPath>
  </defs>

  <g class="base">
    <text x="96" y="25" fill="#568C87">Hi, I'm </text>
    <text x="192" y="25" fill="#616C8C">Motion</text>
    <text x="264" y="25" fill="#568C87">. Orbit Visualization Explorer</text>
  </g>

  <g class="typed">
    <text x="96" y="25" fill="#568C87">Hi, I'm </text>
    <text x="192" y="25" fill="#616C8C">Motion</text>
    <text x="264" y="25" fill="#568C87">. Orbit Visualization Explorer</text>
  </g>

  <rect class="caret" x="96" y="12" width="2" height="25" rx="1" />
</svg>
