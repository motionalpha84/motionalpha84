<svg xmlns="http://www.w3.org/2000/svg" width="720" height="48" viewBox="0 0 720 48" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I’m VELLICHOR — an orbital dynamics researcher.</title>
  <desc id="desc">A one-time typing animation that reveals the profile headline and then remains static.</desc>
  <style>
    text {
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
      font-size: 20px;
      font-weight: 700;
      dominant-baseline: middle;
    }

    .base {
      opacity: 0;
      animation: hold-text 1ms linear 2600ms forwards;
    }

    .typed {
      clip-path: url(#typing-clip);
      animation: hide-typed 1ms linear 2600ms forwards;
    }

    .caret {
      fill: #568C87;
      animation:
        move-caret 2600ms steps(51, end) forwards,
        blink-caret 700ms step-end 0ms 4,
        hide-caret 1ms linear 2900ms forwards;
    }

    @keyframes hold-text {
      to {
        opacity: 1;
      }
    }

    @keyframes move-caret {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(612px);
      }
    }

    @keyframes blink-caret {
      50% {
        opacity: 0;
      }
    }

    @keyframes hide-caret {
      to {
        opacity: 0;
      }
    }

    @keyframes hide-typed {
      to {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .base {
        opacity: 1;
        animation: none;
      }

      .typed,
      .caret {
        display: none;
      }
    }
  </style>

  <defs>
    <clipPath id="typing-clip">
      <rect x="54" y="4" width="0" height="40">
        <animate attributeName="width" from="0" to="612" dur="2600ms" fill="freeze" calcMode="discrete" values="0;12;24;36;48;60;72;84;96;108;120;132;144;156;168;180;192;204;216;228;240;252;264;276;288;300;312;324;336;348;360;372;384;396;408;420;432;444;456;468;480;492;504;516;528;540;552;564;576;588;600;612" keyTimes="0;0.0196;0.0392;0.0588;0.0784;0.098;0.1176;0.1373;0.1569;0.1765;0.1961;0.2157;0.2353;0.2549;0.2745;0.2941;0.3137;0.3333;0.3529;0.3725;0.3922;0.4118;0.4314;0.451;0.4706;0.4902;0.5098;0.5294;0.549;0.5686;0.5882;0.6078;0.6275;0.6471;0.6667;0.6863;0.7059;0.7255;0.7451;0.7647;0.7843;0.8039;0.8235;0.8431;0.8627;0.8824;0.902;0.9216;0.9412;0.9608;0.9804;1" />
      </rect>
    </clipPath>
  </defs>

  <g class="base">
    <text x="54" y="25" fill="#568C87">Hi, I’m </text>
    <text x="150" y="25" fill="#616C8C">VELLICHOR</text>
    <text x="258" y="25" fill="#568C87"> — an orbital dynamics researcher.</text>
  </g>

  <g class="typed">
    <text x="54" y="25" fill="#568C87">Hi, I’m </text>
    <text x="150" y="25" fill="#616C8C">VELLICHOR</text>
    <text x="258" y="25" fill="#568C87"> — an orbital dynamics researcher.</text>
  </g>

  <rect class="caret" x="54" y="12" width="2" height="25" rx="1" />
</svg>
